# NEW staging-only stack. Deliberately does not join dokploy-network or reuse volumes.
# Cloudflare Tunnel config in Zero Trust must point to http://anythingllm-staging:3001.
name: tutor-tds-ai-staging
services:
  anythingllm-staging:
    image: mintplexlabs/anythingllm@sha256:652666b766e5e2474b8018e8850f166a9869c1a1aed23435c48c99cd94b74f4a
    restart: unless-stopped
    environment:
      STORAGE_DIR: /app/server/storage
      NODE_ENV: production
      DISABLE_TELEMETRY: "true"
    ports:
      # Admin/setup only through Tailscale + SSH forwarding, not public internet.
      - "127.0.0.1:3002:3001"
    volumes:
      - tds_ai_staging_data:/app/server/storage
    networks: [tds_ai_staging]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    mem_limit: 3g
    security_opt: ["no-new-privileges:true"]

  cloudflared-staging:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TDS_STAGING_TUNNEL_TOKEN:?Set this in Dokploy or a host-only .env file. Never commit it.}
    depends_on:
      anythingllm-staging:
        condition: service_healthy
    networks: [tds_ai_staging]

volumes:
  tds_ai_staging_data:
    # Docker-managed staging volume. Do not point to the production anythingllm_data.

networks:
  tds_ai_staging:
    driver: bridge
    # Separate network from production. Outbound restrictions require host firewall
    # or dedicated staging VPS; network segregation alone is not total egress isolation.
