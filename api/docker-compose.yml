services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutor_tds
      POSTGRES_USER: tutor_tds
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_tds -d tutor_tds"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - tutor_tds_api_db:/var/lib/postgresql/data

  api:
    build: .
    environment:
      TUTOR_ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://tutor_tds:local-development-only@db:5432/tutor_tds
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?configure JWT_SECRET in api/.env}
      CPF_PEPPER: ${CPF_PEPPER:?configure CPF_PEPPER in api/.env}
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  sync-worker:
    profiles: ["sync"]
    build: .
    environment:
      TUTOR_ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://tutor_tds:local-development-only@db:5432/tutor_tds
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_SHEET_RANGE: ${GOOGLE_SHEET_RANGE:-EventosAPI!A:J}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      SHEETS_PSEUDONYM_SECRET: ${SHEETS_PSEUDONYM_SECRET:-}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-100}
      SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-30}
      SYNC_MAX_ATTEMPTS: ${SYNC_MAX_ATTEMPTS:-3}
      SYNC_LEASE_SECONDS: ${SYNC_LEASE_SECONDS:-300}
    command: python -m app.sync_worker
    depends_on:
      db:
        condition: service_healthy

volumes:
  tutor_tds_api_db:
