[project]
name = "tds-account-mcp"
version = "0.1.0"
description = "Local MCP adapter for Tutor TDS managed accounts"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
tds-account-mcp = "tds_account_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
