server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy para a API de staging — elimina CORS no app web dev.
  location /tutor-staging-api/ {
    proxy_pass https://ead.ipexdesenvolvimento.cloud;
    proxy_ssl_server_name on;
    proxy_set_header Host ead.ipexdesenvolvimento.cloud;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
