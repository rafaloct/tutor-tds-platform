server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — essencial para o main.dart.js do Flutter (>1MB)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # APK download — MIME correto e sem cache
    location ~* \.apk$ {
        add_header Content-Disposition 'attachment; filename="CartilhasTDS.apk"';
        add_header Content-Type "application/vnd.android.package-archive";
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # /app/ — landing page estática (não SPA), servida como diretório real
    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Cache longo para assets com hash no nome (Flutter gera hashes automáticos)
    location ~* \.(js|wasm|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker não deve ser cacheado pelo browser
    location = /flutter_service_worker.js {
        expires off;
        add_header Cache-Control "no-store, no-cache";
        try_files $uri =404;
    }

    # manifest.json e version.json sem cache
    location ~* \.(json)$ {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA routing Flutter — todas as outras rotas voltam para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
