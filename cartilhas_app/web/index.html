<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cartilhas Digitais TDS — cursos gratuitos do Programa Territórios de Desenvolvimento Social para participantes do CadÚnico. Estude no app ou no navegador.">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cartilhas Digitais TDS">
  <meta property="og:title" content="Cartilhas Digitais TDS — cursos gratuitos">
  <meta property="og:description" content="Cursos digitais gratuitos para participantes do CadÚnico: agricultura sustentável, cooperativismo, educação financeira e mais.">
  <meta property="og:url" content="https://cartilhas.ipexdesenvolvimento.cloud/">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="https://cartilhas.ipexdesenvolvimento.cloud/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://cartilhas.ipexdesenvolvimento.cloud/">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"Cartilhas Digitais TDS",
   "url":"https://cartilhas.ipexdesenvolvimento.cloud/",
   "inLanguage":"pt-BR",
   "publisher":{"@type":"Organization","name":"Territórios de Desenvolvimento Social"}}
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TDS">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon multi-tamanho -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png"/>
  <meta name="theme-color" content="#093AF4"/>

  <title>Cartilhas Digitais TDS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F7F8FC; }
    #tds-splash {
      position: fixed; inset: 0; z-index: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: #F7F8FC; color: #262626;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #tds-splash img { width: 96px; height: 96px; border-radius: 24px; }
    #tds-splash .tds-name { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
    #tds-splash .tds-bar {
      width: 160px; height: 4px; border-radius: 2px; overflow: hidden;
      background: #E1E3EA; position: relative;
    }
    #tds-splash .tds-bar::after {
      content: ''; position: absolute; inset: 0; width: 40%;
      background: #093AF4; border-radius: 2px;
      animation: tds-slide 1.2s ease-in-out infinite;
    }
    @keyframes tds-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <div id="tds-splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <div class="tds-name">Tutor TDS</div>
    <div class="tds-bar"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
