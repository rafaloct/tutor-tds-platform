name: Tutor TDS Flutter app checks

on:
  pull_request:
    paths:
      - "cartilhas_app/**"
      - ".github/workflows/flutter-app.yml"
  push:
    branches: [codex/onda-0-consolidacao]
    paths:
      - "cartilhas_app/**"
      - ".github/workflows/flutter-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: "3.44.9"
      FLUTTER_ARCHIVE_SHA256: a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb
    defaults:
      run:
        working-directory: cartilhas_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${archive}"
          echo "${FLUTTER_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xf "$archive"
          rm "$archive"
          echo "${RUNNER_TEMP}/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify SDK version
        run: |
          flutter --disable-analytics
          flutter --version --machine | python3 -c 'import json,os,sys; v=json.load(sys.stdin)["frameworkVersion"]; assert v == os.environ["FLUTTER_VERSION"], v; print(v)'
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --reporter expanded
