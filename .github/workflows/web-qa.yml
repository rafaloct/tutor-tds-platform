name: Tutor TDS Flutter Web E2E (staging)

# Suite E2E do app Flutter Web contra a API de staging real
# (ead.ipexdesenvolvimento.cloud/tutor-staging-api, endpoint publico).
# Executa tooling/web_qa.sh: build release -> app+proxy nginx :9090 ->
# chromedriver headless -> 7 arquivos integration_test.
# Conta QA e credenciais sao fixtures de teste ja commitadas
# (defaults dos testes + config/staging.qa.web.json); sem secrets.

on:
  pull_request:
    # Branch de integracao real do repo e codex/onda-0-consolidacao
    # (HEAD do origin); main/develop listadas para quando existirem.
    branches: [codex/onda-0-consolidacao, main, develop]
    paths:
      - "cartilhas_app/**"
      - "tooling/**"
      - ".github/workflows/web-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: "3.44.9"
      FLUTTER_ARCHIVE_SHA256: a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${archive}"
          echo "${FLUTTER_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xf "$archive"
          rm "$archive"
          echo "${RUNNER_TEMP}/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify SDK version
        run: |
          flutter --disable-analytics
          flutter --version --machine | python3 -c 'import json,os,sys; v=json.load(sys.stdin)["frameworkVersion"]; assert v == os.environ["FLUTTER_VERSION"], v; print(v)'

      - name: Setup headless Chromium + chromedriver
        run: |
          # Runner image traz google-chrome + chromedriver pareados.
          # web_qa.sh espera o wrapper /usr/local/bin/chromium-nosandbox
          # (container/root exige --no-sandbox) e chromedriver no PATH.
          chrome_bin="${CHROME_BIN:-$(command -v google-chrome || command -v chromium-browser || command -v chromium)}"
          test -n "$chrome_bin" || { echo "chrome nao encontrado"; exit 1; }
          printf '#!/bin/bash\nexec "%s" --no-sandbox --disable-gpu --disable-dev-shm-usage "$@"\n' \
            "$chrome_bin" | sudo tee /usr/local/bin/chromium-nosandbox >/dev/null
          sudo chmod +x /usr/local/bin/chromium-nosandbox
          if [ -n "${CHROMEWEBDRIVER:-}" ]; then
            echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
          fi
          chromedriver --version
          /usr/local/bin/chromium-nosandbox --version

      - name: Resolve locked dependencies
        working-directory: cartilhas_app
        run: flutter pub get --enforce-lockfile

      - name: Run Web E2E suite (./tooling/web_qa.sh)
        env:
          FLUTTER: flutter
        run: ./tooling/web_qa.sh
