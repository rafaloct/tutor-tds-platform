name: Secret scan (new commits)

on:
  pull_request:
  push:
    branches: [codex/onda-0-consolidacao]
  workflow_dispatch:
    inputs:
      log_opts:
        description: "git log range to scan (e.g. HEAD~20..HEAD)"
        required: true

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_ARCHIVE_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          install -d gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          rm "$archive"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Resolve commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DISPATCH_RANGE: ${{ inputs.log_opts }}
        run: |
          case "$EVENT_NAME" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="${PUSH_AFTER}^!"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi ;;
            *) range="$DISPATCH_RANGE" ;;
          esac
          echo "Scanning: $range ($(git rev-list --count "$range") commits)"
          echo "SCAN_RANGE=$range" >> "$GITHUB_ENV"
      - name: Scan (values redacted)
        run: |
          gitleaks git --config .gitleaks.toml --log-opts="$SCAN_RANGE" \
            --redact --no-banner --verbose --exit-code 1 .
