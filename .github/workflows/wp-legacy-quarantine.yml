name: WordPress legacy quarantine

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tooling/verify_wp_legacy_snapshot.py
