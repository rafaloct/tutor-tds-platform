name: Staging authenticated smoke

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_STAGING_AUTHENTICATED_SMOKE
        required: true
        type: string
      fixture_class_id:
        description: Disposable isolated staging fixture class ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tutor-tds-staging-authenticated-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: inputs.confirmation == 'RUN_STAGING_AUTHENTICATED_SMOKE'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run read-only authenticated staging smoke
        env:
          STAGING_SMOKE_ADMIN_CPF: ${{ secrets.STAGING_SMOKE_ADMIN_CPF }}
          STAGING_SMOKE_ADMIN_PASSWORD: ${{ secrets.STAGING_SMOKE_ADMIN_PASSWORD }}
          STAGING_SMOKE_TEACHER_CPF: ${{ secrets.STAGING_SMOKE_TEACHER_CPF }}
          STAGING_SMOKE_TEACHER_PASSWORD: ${{ secrets.STAGING_SMOKE_TEACHER_PASSWORD }}
          STAGING_SMOKE_MONITOR_CPF: ${{ secrets.STAGING_SMOKE_MONITOR_CPF }}
          STAGING_SMOKE_MONITOR_PASSWORD: ${{ secrets.STAGING_SMOKE_MONITOR_PASSWORD }}
          STAGING_SMOKE_STUDENT_CPF: ${{ secrets.STAGING_SMOKE_STUDENT_CPF }}
          STAGING_SMOKE_STUDENT_PASSWORD: ${{ secrets.STAGING_SMOKE_STUDENT_PASSWORD }}
          STAGING_SMOKE_BASE_URL: https://tutor-tds-staging.fastapicloud.dev
          STAGING_SMOKE_CLASS_ID: ${{ inputs.fixture_class_id }}
        shell: bash
        run: |
          set +e
          set -euo pipefail
          python3 api/ops/staging_role_smoke.py \
            "$STAGING_SMOKE_BASE_URL" "$STAGING_SMOKE_CLASS_ID" \
            > "$RUNNER_TEMP/authenticated-smoke.raw.log" 2>&1
          status=$?
          set -e

          raw="$RUNNER_TEMP/authenticated-smoke.raw.log"
          safe="$RUNNER_TEMP/authenticated-smoke.log"
          if grep -Eiq 'Bearer |(access|refresh|checkin)_token|STAGING_SEED_[A-Z_]+=' "$raw"; then
            printf '%s\n' 'Smoke output rejected by the credential leak guard.' > "$safe"
            rm -f -- "$raw"
            exit 3
          fi
          mv "$raw" "$safe"
          cat "$safe"
          exit "$status"

      - name: Record immutable evidence metadata
        if: always()
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/staging-authenticated-smoke-evidence"
          install -d -m 700 "$evidence"
          if test -f "$RUNNER_TEMP/authenticated-smoke.log"; then
            install -m 600 "$RUNNER_TEMP/authenticated-smoke.log" "$evidence/"
          fi
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "source_sha=$GITHUB_SHA"
            echo "source_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "environment=staging"
            echo "target=https://tutor-tds-staging.fastapicloud.dev"
            echo "fixture_class_id=${{ inputs.fixture_class_id }}"
            echo "scope=read-only-authentication"
          } > "$evidence/metadata.txt"
          (
            cd "$evidence"
            sha256sum ./* > SHA256SUMS.txt
          )

      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-authenticated-smoke-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-authenticated-smoke-evidence
          if-no-files-found: error
          retention-days: 14
