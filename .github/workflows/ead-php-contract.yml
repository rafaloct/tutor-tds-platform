# Focused read-only PHP contract check for the LearnPress editorial adapter.
# No WordPress deployment, secrets, databases, or institutional data.
name: EAD PHP editorial contract
on:
  push:
    branches:
      - agent/issue-288-ipex-mp4-approval-20261019
    paths:
      - 'wordpress/tds-learnpress-editorial/**'
      - '.github/workflows/ead-php-contract.yml'
  pull_request:
    paths:
      - 'wordpress/tds-learnpress-editorial/**'
      - '.github/workflows/ead-php-contract.yml'
permissions:
  contents: read
jobs:
  php-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout candidate only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify PHP syntax
        run: |
          set -euo pipefail
          php -v | head -2
          php -l wordpress/tds-learnpress-editorial/includes/class-tds-learnpress-editorial.php
          php -l wordpress/tds-learnpress-editorial/includes/class-tds-learnpress-editorial-admin.php
          php -l wordpress/tds-learnpress-editorial/tds-learnpress-editorial.php
          php -l wordpress/tds-learnpress-editorial/tests/test-contract.php
      - name: Run isolated policy contract
        run: |
          set -euo pipefail
          php wordpress/tds-learnpress-editorial/tests/test-contract.php
