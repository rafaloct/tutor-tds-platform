name: Tutor TDS API CI and staging

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/tutor-api.yml"
  push:
    paths:
      - "api/**"
      - ".github/workflows/tutor-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install API and test dependencies
        working-directory: api
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Compile and run tests
        working-directory: api
        run: |
          python -m compileall -q app tests ops
          bash -n ops/*.sh
          python -m pytest tests -q
      - name: Validate compose manifests
        run: |
          docker compose -f api/docker-compose.yml config --quiet --no-interpolate
          docker compose -f api/docker-compose.production.yml config --quiet --no-interpolate
          docker compose -f api/docker-compose.production.yml config --format json --no-interpolate |
            python -c 'import json,sys; data=json.load(sys.stdin); names=("db","api","sync-worker"); assert all(data["services"][name]["logging"] == {"driver":"json-file","options":{"max-file":"5","max-size":"20m"}} for name in names)'
          docker compose -f api/docker-compose.staging.yml config --format json --no-interpolate |
            python -c 'import json,sys; data=json.load(sys.stdin); names=("db-staging","api-staging","sync-worker-staging"); assert data["services"]["sync-worker-staging"]["profiles"] == ["sheets-sync"]; assert all(data["services"][name]["logging"] == {"driver":"json-file","options":{"max-file":"5","max-size":"20m"}} for name in names)'
          docker compose -f api/docker-compose.staging.yml --profile sheets-sync config --quiet --no-interpolate
          docker compose -f api/docker-compose.staging.yml --profile sheets-sync config --format json --no-interpolate |
            python -c 'import json,sys; data=json.load(sys.stdin); assert "sync-worker-staging" in data["services"]'

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: image
        name: Resolve immutable image reference
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "ref=ghcr.io/${repository}/tutor-tds-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build immutable image
        run: docker build --pull --tag "${{ steps.image.outputs.ref }}" api
      - name: Authenticate to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push immutable image
        if: github.event_name == 'push'
        run: docker push "${{ steps.image.outputs.ref }}"

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: tutor-api-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure pinned SSH host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Authenticate staging host to GHCR
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          REGISTRY_USER: ${{ secrets.STAGING_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io --username '$REGISTRY_USER' --password-stdin"
      - name: Copy reviewed staging manifests
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          case "$DEPLOY_PATH" in
            /|*[!A-Za-z0-9_./-]*) echo "STAGING_DEPLOY_PATH must be a safe absolute path below root." >&2; exit 2 ;;
            /*) ;;
            *) echo "STAGING_DEPLOY_PATH must be absolute." >&2; exit 2 ;;
          esac
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/ops'"
          scp -P "$SSH_PORT" api/docker-compose.staging.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.staging.yml"
          scp -P "$SSH_PORT" api/ops/deploy_staging.sh api/ops/smoke_test.py "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/ops/"
      - name: Deploy with health gate and automatic image rollback
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chmod 700 '$DEPLOY_PATH/ops/deploy_staging.sh' && '$DEPLOY_PATH/ops/deploy_staging.sh' '$IMAGE' '$DEPLOY_PATH'"
