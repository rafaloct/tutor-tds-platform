# Temporary verification workflow; removed after reviewed Linux baseline update.
name: EAD PR284 Linux golden capture
on:
  push:
    branches:
      - agent/issue-283-android-real-qa-20261019
    paths:
      - .github/workflows/qa-pr284-linux-golden-capture.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: "3.44.9"
      FLUTTER_ARCHIVE_SHA256: a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb
    defaults:
      run:
        working-directory: cartilhas_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter for Linux
        working-directory: ${{ runner.temp }}
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${archive}"
          echo "${FLUTTER_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xf "$archive"
          rm "$archive"
          echo "${RUNNER_TEMP}/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate only issue282 SAF Linux path reference
        run: |
          mkdir -p test/goldens/linux
          flutter test --update-goldens --reporter expanded test/ead_learning_path_golden_test.dart
      - name: Upload exact Linux PNG for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr284-saf-linux-golden
          path: cartilhas_app/test/goldens/linux/ead_saf_learning_path_preview.png
          if-no-files-found: error
