services:
  tds_tutor_gateway.client:
    class: Drupal\tds_tutor_gateway\Client\TutorApiClient
    arguments: ['@http_client', '@settings', '@uuid', '@datetime.time']
  Drupal\tds_tutor_gateway\Client\TutorApiClientInterface:
    alias: tds_tutor_gateway.client

  tds_tutor_gateway.token_store:
    class: Drupal\tds_tutor_gateway\Storage\DrupalSessionTutorTokenStore
    arguments: ['@request_stack']
  Drupal\tds_tutor_gateway\Storage\TutorTokenStoreInterface:
    alias: tds_tutor_gateway.token_store

  tds_tutor_gateway.session_lifecycle:
    class: Drupal\tds_tutor_gateway\Session\DrupalTutorSessionLifecycle
    arguments: ['@request_stack']

  tds_tutor_gateway.session_manager:
    class: Drupal\tds_tutor_gateway\Session\TutorSessionManager
    arguments: ['@tds_tutor_gateway.client', '@tds_tutor_gateway.token_store', '@datetime.time', '@event_dispatcher', '@tds_tutor_gateway.session_lifecycle']
  Drupal\tds_tutor_gateway\Session\TutorSessionManagerInterface:
    alias: tds_tutor_gateway.session_manager

  tds_tutor_gateway.session_mutex:
    class: Drupal\tds_tutor_gateway\Lock\DatabaseSessionMutex
    factory: ['Drupal\tds_tutor_gateway\Lock\DatabaseSessionMutex', create]
    arguments: ['@database', '@session_handler.storage']

  http_middleware.tds_tutor_session_lock:
    class: Drupal\tds_tutor_gateway\StackMiddleware\TutorSessionLock
    arguments: ['@session_configuration', !service_closure '@tds_tutor_gateway.session_mutex']
    tags:
      - { name: http_middleware, priority: 60 }

  tds_tutor_gateway.production_session_gate:
    class: Drupal\tds_tutor_gateway\EventSubscriber\ProductionSessionGateSubscriber
    arguments: ['@settings']
    tags:
      - { name: event_subscriber }

  tds_tutor_gateway.browser_session:
    class: Drupal\tds_tutor_gateway\EventSubscriber\BrowserSessionSubscriber
    tags:
      - { name: event_subscriber }
