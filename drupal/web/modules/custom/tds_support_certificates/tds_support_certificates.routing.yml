tds_support_certificates.public:
  path: '/verificar-certificado'
  defaults:
    _controller: '\Drupal\tds_support_certificates\Controller\SupportCertificatesController::verification'
    _title: 'Verificar certificado'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

