ServerTokens Prod
ServerSignature Off
<Directory /var/www/html/web/sites/default/files>
    AllowOverride None
    Options -ExecCGI -Indexes
    <FilesMatch "\.(php[0-9]?|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "^/(core/install\.php|update\.php)$">
    Require all denied
</LocationMatch>
